[project]
name = "revenue-anonymization-poc"
version = "0.1.0"
description = "Excel-based revenue and inventory analysis with anonymization mapping and multi-agent QA."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.8.0",
    "mcp==1.28.1",
    "openpyxl>=3.1.0",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "pandas>=2.2.0",
    "requests>=2.31.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
